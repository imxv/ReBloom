name: Adonis

options:
  bundleIdPrefix: studio.adonis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Adonis:
    type: application
    platform: iOS
    sources:
      - path: Adonis
      - path: AdonisShared
    dependencies:
      - target: AdonisShareExtension
        embed: true
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Adonis/Resources/Adonis.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo
        PRODUCT_NAME: Adonis
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos26.*]": "$(inherited) ADONIS_ENABLE_LEGACY_IMAGE_CREATOR"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator26.*]": "$(inherited) ADONIS_ENABLE_LEGACY_IMAGE_CREATOR"
    info:
      path: Adonis/Resources/Info.plist
      properties:
        ADONIS_STICKER_EXTRACTION_URL: "$(ADONIS_STICKER_EXTRACTION_URL)"
        ADONIS_STICKER_PROXY_TOKEN: "$(ADONIS_STICKER_PROXY_TOKEN)"
        CFBundleDisplayName: Adonis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.photo-video
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Adonis 使用相机拍摄你想制作成贴纸的照片。
        NSPhotoLibraryAddUsageDescription: Adonis 仅在你主动选择时把作品保存到相册。
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
    scheme:
      gatherCoverageData: true
      testTargets:
        - AdonisTests
        - AdonisUITests

  AdonisShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AdonisShareExtension
      - path: AdonisShared
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_ENTITLEMENTS: AdonisShareExtension/AdonisShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo.share
        PRODUCT_NAME: AdonisShareExtension
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: AdonisShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 收进 Adonis
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 5

  AdonisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdonisTests
    dependencies:
      - target: Adonis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo.tests
        GENERATE_INFOPLIST_FILE: true

  AdonisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AdonisUITests
    dependencies:
      - target: Adonis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo.uitests
        GENERATE_INFOPLIST_FILE: true
