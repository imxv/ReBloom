name: Adonis

options:
  bundleIdPrefix: studio.adonis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  Adonis:
    type: application
    platform: iOS
    sources:
      - path: Adonis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo
        PRODUCT_NAME: Adonis
        INFOPLIST_KEY_CFBundleDisplayName: Adonis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photo-video
        INFOPLIST_KEY_NSCameraUsageDescription: Adonis 使用相机拍摄你想制作成贴纸的照片。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Adonis 仅在你主动选择时把作品保存到相册。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      gatherCoverageData: true
      testTargets:
        - AdonisTests
        - AdonisUITests

  AdonisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdonisTests
    dependencies:
      - target: Adonis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo.tests
        GENERATE_INFOPLIST_FILE: true

  AdonisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AdonisUITests
    dependencies:
      - target: Adonis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.adonis.localdemo.uitests
        GENERATE_INFOPLIST_FILE: true
